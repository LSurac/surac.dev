# Included at server level and in every location that sets its own add_header (nginx inheritance).
# CSP: no third-party origins at all; fonts and images are self-hosted (docs/security-and-privacy.md).
# 'unsafe-inline' for styles covers Angular's component styles; scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
