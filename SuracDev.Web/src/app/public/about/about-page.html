@if (failure()) {
  <app-unavailable-notice />
} @else {
  <header class="hero">
    <h1>{{ strings().about.title }}</h1>
    <p class="lede">{{ strings().about.lede }}</p>
  </header>

  @for (interest of interests(); track interest.id) {
    <section class="section">
      <ui-section-heading [number]="interest.number" [title]="interest.title" />
      <div
        class="about__entry"
        [class.about__entry--with-image]="interest.image"
        [class.about__entry--image-first]="interest.imageFirst"
      >
        <div class="about__text">
          @if (interest.bodyHtml; as html) {
            <ui-prose [html]="html" />
          }
        </div>
        @if (interest.image; as image) {
          <figure class="about__figure">
            <img
              class="about__image"
              [src]="image.url"
              [alt]="image.alt"
              width="360"
              height="450"
              [attr.loading]="image.eager ? null : 'lazy'"
              [attr.fetchpriority]="image.eager ? 'high' : null"
            />
            <figcaption class="about__caption">{{ image.alt }}</figcaption>
          </figure>
        }
      </div>
    </section>
  }
}
