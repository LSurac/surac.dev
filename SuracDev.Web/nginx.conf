# Front door of the web container: static assets and SSR pages from the node process, /api from
# the API container. Caddy terminates TLS in production and repeats nothing from here; staging has
# no Caddy, so the security headers are set here too (security-headers.conf).

# Without a proxy in front (staging) X-Forwarded-Proto arrives empty; pass the own scheme instead.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  include /etc/nginx/security-headers.conf;

  # Uploads (documents, photos) go through the API; matches its request size limit.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Redirects carry a relative Location: behind Caddy nginx would otherwise name its own scheme
  # and port (http://…:8080).
  absolute_redirect off;

  location /api/ {
    proxy_pass http://surac-dev-api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    include /etc/nginx/security-headers.conf;
  }

  location / {
    # One URL per page: /ueber-mich/ answers 301 to /ueber-mich, the canonical form. Only plain
    # path characters match, so neither //host nor decoded control characters reach the Location.
    rewrite "^/([A-Za-z0-9][A-Za-z0-9/_.-]*[A-Za-z0-9_.-])/$" /$1 permanent;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    include /etc/nginx/security-headers.conf;
  }
}
