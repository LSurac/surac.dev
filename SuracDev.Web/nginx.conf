# Front door of the web container: static assets and SSR pages from the node process, /api from
# the API container. Caddy terminates TLS in production and repeats nothing from here; staging has
# no Caddy, so the security headers are set here too (security-headers.conf).
server {
  listen 8080;
  server_name _;
  server_tokens off;

  include /etc/nginx/security-headers.conf;

  # Uploads (documents, photos) go through the API; matches its request size limit.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://surac-dev-api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    include /etc/nginx/security-headers.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    include /etc/nginx/security-headers.conf;
  }
}
