name: Deploy production

# Push to master: gates, end-to-end tests, then deploy.ps1 -Production over SSH to the VPS. Host
# and host key come from repository variables, the key from a secret; nothing about the host is in
# this file (docs/ops-and-deploy.md). Windows only for deploy.ps1 (robocopy, native ssh/scp).
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "deploy/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  e2e:
    name: End-to-end
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: suracdev_e2e
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d suracdev_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: SuracDev.Web/package-lock.json

      - name: Build API
        run: dotnet build SuracDev.slnx --configuration Debug

      - name: Install and build web
        working-directory: SuracDev.Web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: SuracDev.Web
        env:
          E2E_CONNECTION_STRING: "Host=localhost;Port=55432;Database=suracdev_e2e;Username=e2e;Password=e2e"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: SuracDev.Web/e2e-report/

  deploy:
    name: Deploy
    needs: [gates, e2e]
    # Skipped, not failed, until the production host is configured in the repository variables.
    if: vars.PROD_HOST != ''
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure deploy SSH access
        shell: pwsh
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_HOST_KEY: ${{ vars.PROD_HOST_KEY }}
        run: |
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          # An OpenSSH key needs LF line endings and a trailing newline; WriteAllText with BOM-less UTF8 keeps both.
          $keyPath = Join-Path $sshDir "surac-dev-prod_ed25519"
          $normalizedKey = ($env:DEPLOY_KEY -replace "`r`n", "`n").TrimEnd("`n") + "`n"
          [System.IO.File]::WriteAllText($keyPath, $normalizedKey, [System.Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERDOMAIN)\$($env:USERNAME):(R)" | Out-Null

          @"
          Host $env:PROD_HOST
              User deploy
              IdentityFile $keyPath
              IdentitiesOnly yes
          "@ | Set-Content -Path (Join-Path $sshDir "config")

          # Pinned host key instead of trust on first use.
          "$env:PROD_HOST $env:PROD_HOST_KEY" | Add-Content -Path (Join-Path $sshDir "known_hosts")

      - name: Deploy
        shell: pwsh
        run: .\deploy.ps1 -TargetHost "${{ vars.PROD_HOST }}" -TargetUser deploy -RemotePath /opt/surac-dev -SkipLocalBuild -Production
